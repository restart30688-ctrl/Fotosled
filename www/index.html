<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7FD4FF"><title>ФОТОСЛЕД</title>
<style>
:root{--sky:#7FD4FF;--sky2:#35B6F5;--sun:#FFD84D;--pink:#FF5FA2;--pink2:#E03C82;--lime:#8BD450;--lime2:#5FA832;--or:#FF9A3D;--or2:#E0761C;--pur:#A97BFF;--pur2:#8354E0;--cream:#FFF6E5;--paper:#FFFDF7;--ink:#4A3520;--mu:#8A7256;--sh:#E8D9BE}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;overscroll-behavior:none}
body{font:15px/1.4 system-ui,'Segoe UI',Roboto,sans-serif;font-weight:700;color:var(--ink);background:var(--sky);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
canvas,img,svg{display:block;max-width:100%}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-track{background:#FFE9C4;border-radius:10px}::-webkit-scrollbar-thumb{background:var(--pink);border-radius:10px;border:3px solid #FFE9C4}
#bg{position:fixed;inset:0;z-index:0;background:linear-gradient(#5EC8FA,#9FE4FF 45%,#DFF7C9)}
#sun{position:absolute;right:6%;top:5%;width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFF3A8,var(--sun));box-shadow:0 0 0 14px rgba(255,216,77,.3),0 0 40px rgba(255,216,77,.6);animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(9px)}}
.cl{position:absolute;background:#fff;border-radius:50px;opacity:.9}
.cl:before,.cl:after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:120px;height:36px;top:13%;left:-140px;animation:dr 36s linear infinite}
.c1:before{width:50px;height:50px;top:-21px;left:20px}.c1:after{width:36px;height:36px;top:-13px;left:66px}
.c2{width:90px;height:28px;top:31%;left:-120px;animation:dr 48s linear infinite 7s}
.c2:before{width:38px;height:38px;top:-16px;left:16px}.c2:after{width:28px;height:28px;top:-10px;left:50px}
@keyframes dr{to{transform:translateX(118vw)}}
#hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:36vh}
#app{position:relative;z-index:2;display:grid;grid-template-columns:166px minmax(0,1fr);height:100%;max-width:1400px;margin:0 auto;background:rgba(255,246,229,.5);box-shadow:0 0 0 5px #fff}
#rail{display:flex;flex-direction:column;gap:7px;padding:10px 9px;background:var(--cream);border-right:5px solid #fff;overflow-y:auto}
.logo{display:flex;align-items:center;gap:8px;padding:2px 4px 6px;font-weight:900;font-size:14px;color:var(--pink2)}
.logo b{font-size:23px;animation:bob 3s ease-in-out infinite}
.nb{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:18px;font-weight:900;font-size:13px;color:var(--mu);background:#fff;box-shadow:0 4px 0 var(--sh);min-height:46px;width:100%;text-align:left}
.nb i{font-style:normal;font-size:19px}
.nb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
.nb.on{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink2)}
.spc{flex:1;min-height:4px}
#chat{display:flex;align-items:center;gap:8px;padding:10px;border-radius:18px;background:var(--sky2);color:#fff;font-weight:900;font-size:12px;box-shadow:0 4px 0 #1E90CE;width:100%;min-height:46px}
#chat:active{transform:translateY(3px);box-shadow:0 1px 0 #1E90CE}
#rAg{display:flex;align-items:center;gap:8px;padding:6px;border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--sh);width:100%;min-height:50px}
#rAg b,#tAg b{font-size:12px;display:block;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rAg i{font-size:9px;color:var(--pink2);font-style:normal;display:block;text-align:left}
#main{display:flex;flex-direction:column;min-width:0;height:100%}
#top{flex:none;height:54px;display:flex;align-items:center;gap:8px;padding:0 13px;background:#fff;border-bottom:5px solid var(--cream)}
#vt{font-weight:900;font-size:15px;color:var(--pink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{margin-left:auto;display:flex;align-items:center;gap:7px}
.ib{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--cream);box-shadow:0 4px 0 var(--sh);font-size:18px;flex:none}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
.ib.off{opacity:.45}
#tAg{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 5px;border-radius:16px;background:var(--sun);box-shadow:0 4px 0 #E0B92F;max-width:180px}
#tAg i{font-size:10px;color:#7A5C00;font-style:normal;display:block;text-align:left}
#cont{flex:1;overflow-y:auto;padding:13px 15px 24px}
.v{display:none}.v.on{display:block;animation:pop .3s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(9px)}}
h2.sub{font-weight:900;font-size:11.5px;color:var(--mu);margin:13px 0 8px}
.pan{background:var(--paper);border:4px solid #fff;border-radius:24px;padding:13px;box-shadow:0 6px 0 rgba(180,150,110,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:900;font-size:14px;border-radius:18px;padding:11px 15px;min-height:46px;color:#fff;background:var(--pink);box-shadow:0 5px 0 var(--pink2)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink2)}
.btn:disabled{opacity:.45}
.bs{background:var(--sky2);box-shadow:0 5px 0 #1E90CE}.bs:active{box-shadow:0 1px 0 #1E90CE}
.bg{background:var(--lime);box-shadow:0 5px 0 var(--lime2)}.bg:active{box-shadow:0 1px 0 var(--lime2)}
.bo{background:var(--or);box-shadow:0 5px 0 var(--or2)}.bo:active{box-shadow:0 1px 0 var(--or2)}
.bw{background:#fff;color:var(--mu);box-shadow:0 5px 0 var(--sh)}.bw:active{box-shadow:0 1px 0 var(--sh)}
.sm{min-height:38px;padding:7px 12px;font-size:12.5px;border-radius:15px}.w{width:100%}.big{min-height:56px;font-size:16px}
.row{display:flex;gap:9px;align-items:center}.gr2{flex:1;min-width:0}.tn{font-size:11.5px}.mu{color:var(--mu)}
input[type=text]{width:100%;background:#fff;border:3px solid #FFE0B2;border-radius:16px;padding:11px 13px;font-size:14px;font-weight:700;outline:none}
input:focus{border-color:var(--pink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:15px;background:#fff;box-shadow:0 3px 0 var(--sh);font-weight:900;font-size:11.5px;min-height:36px;display:inline-flex;align-items:center;gap:6px;color:var(--mu)}
.chip.on{background:var(--pur);color:#fff;box-shadow:0 3px 0 var(--pur2)}
.chip i{font-style:normal;font-size:10px;background:rgba(0,0,0,.12);border-radius:8px;padding:1px 6px}
.seg{display:flex;background:#FFEFD5;border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px 5px;border-radius:13px;font-weight:900;font-size:11.5px;color:var(--mu);min-height:38px}
.seg button.on{background:var(--or);color:#fff;box-shadow:0 3px 0 var(--or2)}
.sw{display:flex;align-items:center;gap:9px;min-height:38px}.sw input{display:none}
.sw .t{width:48px;height:27px;border-radius:20px;background:var(--sh);position:relative;flex:none}
.sw .t:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+.t{background:var(--lime)}.sw input:checked+.t:after{left:24px}
.sw span.l{font-weight:900;font-size:13px}
input[type=range]{-webkit-appearance:none;width:100%;height:34px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:10px;background:linear-gradient(90deg,var(--lime),var(--sun),var(--pink))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-7px;border-radius:50%;background:#fff;border:4px solid var(--pink)}
input[type=range]:disabled{opacity:.4}
select{background:#fff;border:3px solid #FFE0B2;border-radius:15px;padding:8px 11px;font-weight:900;font-size:12px;min-height:38px;outline:none}
.av{display:inline-grid;place-items:center;flex:none;position:relative}
.crown{position:absolute;top:-9px;right:-9px;font-size:16px;animation:bob 2s ease-in-out infinite}
#guide{display:flex;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.gs{flex:1;min-width:152px;display:flex;gap:10px;align-items:center;background:var(--paper);border:4px solid #fff;border-radius:22px;padding:10px 12px;box-shadow:0 5px 0 rgba(180,150,110,.22)}
.gs.act{background:#FFF0C9;border-color:var(--sun)}.gs.done{background:#E9F9D8;border-color:var(--lime)}
.gs b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:#FFE0B2;color:var(--mu);flex:none}
.gs.act b{background:var(--sun)}.gs.done b{background:var(--lime);color:#fff}
.gs p{font-size:12.5px;font-weight:900}.gs small{display:block;font-size:10px;color:var(--mu)}
#leadB{display:flex;align-items:center;gap:11px;padding:11px 13px;margin-bottom:11px;border-radius:24px;background:linear-gradient(100deg,#FFE9A8,#FFD1E6);border:4px solid #fff;box-shadow:0 5px 0 rgba(180,150,110,.22);flex-wrap:wrap}
#leadB .t{font-weight:900;font-size:14px;color:var(--pink2)}
#strip{display:flex;align-items:center;gap:12px;padding:11px 13px;margin-bottom:11px;background:var(--paper);border:4px solid #fff;border-radius:24px;box-shadow:0 5px 0 rgba(180,150,110,.22);flex-wrap:wrap}
#strip .nm{font-weight:900;font-size:15px}#strip .rk{font-size:10.5px;font-weight:900;color:var(--or2)}
.xpb{height:12px;border-radius:10px;background:#FFE9C4;margin-top:6px;overflow:hidden;border:2px solid #fff}
.xpb i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--sun))}
.goal{font-size:11px;font-weight:900;color:#fff;background:var(--pur);padding:8px 11px;border-radius:16px;max-width:240px;box-shadow:0 3px 0 var(--pur2)}
.bt{display:flex;gap:9px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
#board{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:11px}
